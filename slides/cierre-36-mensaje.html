<section class="slide center" data-slide="ia42">
  <style>
    #sia42 { overflow: hidden; background: var(--bg); padding: 120px 160px; }

    /* red de partículas de fondo (como la portada, MUY sutil) */
    #sia42 .sia42-net { position: absolute; inset: 0; z-index: 0; }

    #sia42 .sia42-content { position: relative; z-index: 2; width: 1560px; margin: 0 auto; text-align: center; }

    #sia42 .sia42-kicker { justify-content: center; margin-bottom: 60px; opacity: 0; }

    #sia42 .sia42-quote {
      font-family: var(--serif); font-weight: 700; color: var(--ink);
      font-size: 96px; line-height: 1.12; letter-spacing: -.015em;
    }
    #sia42 .sia42-quote .ln { display: block; }
    #sia42 .sia42-quote .ln + .ln { margin-top: 30px; }
    /* segunda frase en un tono algo distinto para articular el contraste */
    #sia42 .sia42-quote .ln.b { color: var(--ink-soft); }

    /* palabra por palabra: animables (inline-block para transform) */
    #sia42 .sia42-quote .w { display: inline-block; will-change: transform, opacity; }
    #sia42 .sia42-quote .mk { color: var(--accent); font-style: italic; }

    #sia42 .sia42-remate {
      margin-top: 74px; font-family: var(--font); font-weight: 400;
      font-size: 38px; line-height: 1.5; color: var(--muted);
    }
    #sia42 .sia42-remate .u { color: var(--ink); font-weight: 600; }
    #sia42 .sia42-remate::before {
      content: ""; display: block; width: 96px; height: 3px;
      background: var(--accent); margin: 0 auto 34px;
    }
  </style>

  <div id="sia42" class="fill center-xy">
    <canvas class="sia42-net"></canvas>

    <div class="sia42-content">
      <div class="kicker plain sia42-kicker">El mensaje</div>

      <div class="sia42-quote">
        <span class="ln a">
          <span class="w">La</span> <span class="w">IA</span> <span class="w">no</span> <span class="w">va</span> <span class="w">a</span> <span class="w mk">sustituir</span> <span class="w">a</span> <span class="w">los</span> <span class="w">médicos.</span>
        </span>
        <span class="ln b">
          <span class="w">Pero</span> <span class="w">los</span> <span class="w">médicos</span> <span class="w">que</span> <span class="w">la</span> <span class="w">usen</span> <span class="w">van</span> <span class="w">a</span> <span class="w">trabajar</span> <span class="w mk">mejor</span> <span class="w">que</span> <span class="w">los</span> <span class="w">que</span> <span class="w">no.</span>
        </span>
      </div>

      <p class="sia42-remate fragment fade-only">
        Es una herramienta. Y las herramientas <span class="u">amplifican a quien las domina</span>.
      </p>
    </div>
  </div>

  <script>
  (function () {
    const root = document.currentScript.closest('.slide');
    const g = window.gsap || (window.Deck && Deck.gsap) || null;

    /* ---------- red de partículas (patrón de la portada, muy sutil) ---------- */
    const cv = root.querySelector('.sia42-net');
    const ctx = cv.getContext('2d');
    let raf = null, W = 1920, H = 1080, t = 0;
    const N = 58, R = 220;
    const pts = [];
    function seed() {
      pts.length = 0;
      for (let i = 0; i < N; i++) {
        pts.push({ x: Math.random()*W, y: Math.random()*H,
                   vx: (Math.random()-.5)*0.22, vy: (Math.random()-.5)*0.22,
                   r: Math.random()*1.8+1.0 });
      }
    }
    function resize() { cv.width = W; cv.height = H; }
    function frame() {
      t += 0.004;
      ctx.clearRect(0,0,W,H);
      for (let i=0;i<N;i++){
        const a = pts[i];
        a.x += a.vx + Math.sin(t + i)*0.04; a.y += a.vy + Math.cos(t + i)*0.04;
        if(a.x<0||a.x>W)a.vx*=-1; if(a.y<0||a.y>H)a.vy*=-1;
        for(let j=i+1;j<N;j++){
          const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
          if(d<R){
            const o=(1-d/R)*0.10;
            ctx.strokeStyle='rgba(166,9,61,'+o+')';
            ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      for(const p of pts){
        ctx.fillStyle='rgba(20,23,28,0.09)';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }

    /* ---------- entrada de la frase, palabra a palabra ---------- */
    const words  = Array.from(root.querySelectorAll('.sia42-quote .w'));
    const kicker = root.querySelector('.sia42-kicker');

    function reset() {
      if (g) { g.set(words, { opacity: 0, y: 26 }); g.set(kicker, { opacity: 0 }); }
      else { words.forEach(w => w.style.opacity = 0); kicker.style.opacity = 0; }
    }
    function play() {
      if (!g) { words.forEach(w => w.style.opacity = 1); kicker.style.opacity = 1; return; }
      const tl = g.timeline();
      tl.to(kicker, { opacity: 1, duration: .7, ease: 'power2.out' })
        .to(words, { opacity: 1, y: 0, duration: .62, ease: 'power3.out', stagger: 0.075 }, 0.35);
    }

    Deck.register("ia42", {
      onReset() { reset(); },
      onEnter() {
        resize(); seed(); if (!raf) frame();
        reset(); requestAnimationFrame(play);
      },
      onLeave() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    });
  })();
  </script>
</section>
